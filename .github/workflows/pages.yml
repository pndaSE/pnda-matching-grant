name: Publier le site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Garde-fou — aucune clé secrète dans web/
        run: |
          if grep -rIlE 'service_role|SUPABASE_SERVICE_ROLE|sb_secret_' web/ ; then
            echo "::error::Une clé de service semble présente dans web/. Publication interrompue."
            exit 1
          fi
          echo "web/ ne contient aucune clé de service."

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter web/
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
