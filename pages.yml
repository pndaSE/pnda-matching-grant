name: Publier sur GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier les secrets
        run: |
          if grep -r "service_role\|sk-" web/; then
            echo "❌ Clé service détectée dans web/ — déploiement annulé"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: "web/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
